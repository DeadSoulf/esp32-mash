name: Validate ESP32-C3 and S3 firmware

on:
  push:
    branches: [main]
    paths:
      - 'gateway/**'
      - 'node/**'
      - 'tests/**'
      - 'Windows-Installer/**'
      - '.github/workflows/esp-idf-c3.yml'
  workflow_dispatch:

permissions:
  contents: read

# Only the newest main commit may publish a release. Earlier pushes must not
# race and overwrite the archive/tag with outdated firmware.
concurrency:
  group: automesh-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.project }} / ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: espressif/idf:v5.5.3
    strategy:
      fail-fast: false
      matrix:
        project: [gateway, node]
        target: [esp32c3, esp32s3]
    steps:
      - uses: actions/checkout@v4

      - name: Verify source invariants
        shell: bash
        run: python3 -m unittest discover -s tests -v

      - name: Build firmware with persisted Mesh configuration
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          source /opt/esp/idf/export.sh
          cd "${{ matrix.project }}"
          grep -qx 'CONFIG_BLE_MESH_SETTINGS=y' sdkconfig.defaults
          idf.py set-target "${{ matrix.target }}"
          idf.py build
          grep -qx 'CONFIG_BLE_MESH_SETTINGS=y' sdkconfig
          grep -qx 'CONFIG_IDF_TARGET="${{ matrix.target }}"' sdkconfig
          ls -l build/*.bin >/dev/null

      - name: Upload verified binaries
        uses: actions/upload-artifact@v4
        with:
          name: automesh-${{ matrix.project }}-${{ matrix.target }}
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ matrix.project }}/build/*.bin
            ${{ matrix.project }}/build/bootloader/bootloader.bin
            ${{ matrix.project }}/build/partition_table/partition-table.bin
            ${{ matrix.project }}/build/flasher_args.json


  package-windows-installer:
    name: Package and publish Windows C3/S3 installer
    needs: build
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: automesh-*
          path: _artifacts
          merge-multiple: false
      - name: Install installer build tools
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check esptool==5.6.0 pyserial pyinstaller
      - name: Stage four matched firmware profiles and hashes
        shell: pwsh
        run: |
          python Windows-Installer/build_release.py --artifacts _artifacts --out _release
      - name: Check embedded web UI JavaScript syntax
        shell: pwsh
        run: |
          $page = Get-Content gateway/main/gateway_index.html -Raw -Encoding UTF8
          $script = [regex]::Match($page, '(?s)<script>(.*?)</script>').Groups[1].Value
          if ([string]::IsNullOrWhiteSpace($script)) { throw 'Web UI script missing' }
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) 'automesh-ui-syntax.js'), $script)
          node --check automesh-ui-syntax.js
          if ($LASTEXITCODE -ne 0) { throw 'Invalid web UI JavaScript' }
      - name: Build and verify self-contained installer
        shell: pwsh
        run: |
          python -m PyInstaller --onefile --console --noconfirm --clean --name AutoMesh-Installer --add-data "_release/manifest.json;." --add-data "_release/images;images" --collect-submodules esptool --collect-data esptool --collect-submodules serial --distpath "_release" Windows-Installer/installer.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }
          & "./_release/AutoMesh-Installer.exe" --self-test
          if ($LASTEXITCODE -ne 0) { throw "Installer self-test failed" }
      - name: Package portable ZIP with sources, licenses and flashing instructions
        shell: pwsh
        run: |
          Copy-Item Windows-Installer/installer.py _release/
          Copy-Item Windows-Installer/Install-AutoMesh.cmd _release/
          Copy-Item Windows-Installer/Check-AutoMesh.cmd _release/
          Copy-Item Windows-Installer/README-RU.txt _release/
          New-Item -ItemType Directory -Path _release/Web-OTA -Force | Out-Null
          Copy-Item _artifacts/automesh-gateway-esp32c3/provisioner.bin _release/Web-OTA/gw-c3.bin
          Copy-Item _artifacts/automesh-gateway-esp32s3/provisioner.bin _release/Web-OTA/gw-s3.bin
          New-Item -ItemType Directory -Path _release/Web-OTA/Nodes -Force | Out-Null
          Copy-Item _artifacts/automesh-node-esp32c3/onoff_server.bin _release/Web-OTA/Nodes/node-c3.bin
          Copy-Item _artifacts/automesh-node-esp32s3/onoff_server.bin _release/Web-OTA/Nodes/node-s3.bin
          Copy-Item Windows-Installer/WEB-OTA-README-RU.txt _release/Web-OTA/README-RU.txt
          $names = @('gw-c3.bin', 'gw-s3.bin',
                     'Nodes/node-c3.bin', 'Nodes/node-s3.bin')
          $hashes = foreach ($name in $names) {
            $hash = (Get-FileHash -Path (Join-Path '_release/Web-OTA' $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          $hashes | Set-Content -Path _release/Web-OTA/SHA256SUMS.txt -Encoding ascii
          if ((Get-ChildItem _release/Web-OTA -Filter '*.bin' -Recurse | Measure-Object).Count -ne 4) { throw 'Web-OTA images missing' }
          Copy-Item Windows-Installer/THIRD-PARTY-LICENSES _release/THIRD-PARTY-LICENSES -Recurse
          Compress-Archive -Path _release/* -DestinationPath AutoMesh-v0.3.25-dev.zip -CompressionLevel Optimal -Force
          Get-FileHash AutoMesh-v0.3.25-dev.zip -Algorithm SHA256 | Format-List
      - name: Upload portable installer archive as CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: automesh-installer-windows-v0.3.25-dev
          path: AutoMesh-v0.3.25-dev.zip
          retention-days: 14
          if-no-files-found: error
      - name: Publish pre-release for Windows downloads
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v0.3.25-dev" --repo "${{ github.repository }}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create "v0.3.25-dev" --repo "${{ github.repository }}" --prerelease --target "${{ github.sha }}" --title "ESP32 AutoMesh v0.3.25-dev (C3 + S3)" --notes "Windows USB installer without mandatory Flash backup; Mesh AppKey restoration and local client rebind after reboot, with NVS preserved. ZIP contains Web-OTA gateway firmware and Web-OTA/Nodes images for ESP32-C3/S3-Zero plus SHA256 hashes. Authorized gateway UI can update one OTA1 Mesh node at a time; nodes relay peer-to-peer independently of gateway. Gateway failover is not automatic. Admin can update gateway or one OTA1 node in a single web form, using full release ZIP or APP .bin; role/chip and SHA256 are checked automatically. Mesh credentials are preserved. OTA files use short names gw-c3.bin, gw-s3.bin, node-c3.bin and node-s3.bin. Node OTA now uses a dedicated FreeRTOS Flash worker and sequential erase; Mesh ACKs are retried, status includes failed stage, and Wi-Fi controls are at page bottom. Interactive Mesh topology uses TTL=1 radio beacons, per-node RSSI reports, a live RAM-only authenticated API and movable/zoomable network nodes. BLE Mesh OTA ACK reception fixed: handle unsolicited vendor-client publish events and use nonzero relay TTL in node status replies. Web UI now has only Devices, Map, and Settings tabs; Wi-Fi and admin key live under Settings, the Map tab shows only the interactive map, and the old radio status panel is removed. OTA2 supports 224-byte Mesh data blocks when advertised by new nodes, falls back to 96-byte OTA1 for old nodes, and displays measured transfer rate/ETA. Mesh map now has an on-demand per-node popup with Locate, state and observed neighbors; missing RSSI is kept as an observed link with unknown quality and diagnostics counters distinguish missing reports. Firmware version appears as a compact version plus C3/S3 in the Devices list and Mesh popup, while raw OTA capability and build checksum are preserved for protocol negotiation."
            if ($LASTEXITCODE -ne 0) { throw "Release creation failed" }
          }
          gh release upload "v0.3.25-dev" "AutoMesh-v0.3.25-dev.zip" --clobber --repo "${{ github.repository }}"
          if ($LASTEXITCODE -ne 0) { throw "Release upload failed" }



